# ===============================
# CONFIGURACIÓN DEL SERVIDOR
# ===============================
server.port=8084
spring.application.name=nlp-service

# ===============================
# CONFIGURACIÓN GROQ (VÍA SPRING AI OPENAI)
# ===============================
spring.ai.openai.api-key=${GROQ_API_KEY}
spring.ai.openai.base-url=https://api.groq.com/openai

# Usamos Llama 3 (o el modelo que prefieras de Groq)
spring.ai.openai.chat.options.model=llama3-70b-8192

# ===============================
# FEIGN CLIENTS (COMUNICACIÓN INTERNA)
# ===============================
# Ajusta el puerto de reserva-service según tu entorno local
app.reserva-service.url=http://localhost:8083 
