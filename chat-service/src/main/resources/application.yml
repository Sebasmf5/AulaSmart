server:
  port: 8084

spring:
  application:
    name: chat-service
  ai:
    openai:
      api-key: ${GROQ_API_KEY}
      base-url: https://api.groq.com/openai/v1
      chat:
        options:
          model: llama-3.3-70b-versatile
          temperature: 0.0

app:
  reserva-service:
    url: http://localhost:8083
