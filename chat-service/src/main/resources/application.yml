server:
  port: 8086

spring:
  application:
    name: chat-service
  autoconfigure:
    exclude:
      - org.springframework.ai.model.openaisdk.autoconfigure.OpenAiSdkImageAutoConfiguration
  ai:
    openai:
      api-key: ${SPRING_AI_OPENAI_API_KEY}
      base-url: ${SPRING_AI_OPENAI_BASE_URL:https://api.groq.com/openai/v1}
      chat:
        options:
          model: ${SPRING_AI_OPENAI_MODEL:openai/gpt-oss-120b}
          temperature: 0.0
  cloud:
    openfeign:
      client:
        config:
          default:
            connectTimeout: 5000
            readTimeout: 90000
          aula-service:
            connectTimeout: 5000
            readTimeout: 90000
          reserva-service:
            connectTimeout: 5000
            readTimeout: 90000
      compression:
        request:
          enabled: true
        response:
          enabled: true

chat:
  system-prompt: |
    Eres AulaBot, el asistente de AulaSmart para UCEVA. La fecha de hoy se te da en cada mensaje.
    
    ## FLUJO DE CONVERSACION (SIGUE ESTE ORDEN SIEMPRE)
    
    ### Paso 1: Preguntar el BLOQUE
    "En que bloque necesitas el aula? Hay bloques de la A hasta la I."
    
    ### Paso 2: Preguntar el TIPO DE AULA
    "Que tipo de aula necesitas? Tenemos: Aula Interactiva, Aula Audiovisual, Laboratorio, Sala, Escenario Deportivo."
    Si dice "cualquiera" o no especifica, asume Aula Interactiva por defecto.
    
    ### Paso 3: Preguntar FECHA y HORARIO
    "Para que fecha y horario? Ej: martes de 9 a 11 am"
    Interpreta: "manana" = dia siguiente, "de 2 a 4" = 14:00-16:00, "martes" = proximo martes
    
    ### Paso 4: Consultar disponibilidad
    Con bloque, tipo, fecha y horario, llama a consultarPorTipo o consultarPorBloque segun corresponda.
    Muestra resultados en tabla: | Bloque | Aula | Codigo | Capacidad |
    
    ### Paso 5: Verificar aula especifica
    Cuando el usuario elija un aula, llama a consultarPorNombreAula para VERIFICACION REAL de disponibilidad.
    Si esta libre, pregunta el MOTIVO. Si esta ocupada, ofrece buscar otra.
    
    ### Paso 6: Reservar
    Con el motivo, llama a reservarAulaTool.
    
    ## REGLAS
    - NUNCA inventes nombres de aulas, bloques o capacidades
    - Si una herramienta falla: "No pude consultar. Intentamos de nuevo?"
    - Si el aula esta ocupada: "Esa aula ya esta ocupada. Quieres buscar otra?"
  cache:
    enabled: ${CHAT_CACHE_ENABLED:true}

conexion:
  servicios:
    aula-service:
      url: ${URL_SERVICIO_ASISTENCIA:http://aula-service:8083}
    reserva-service:
      url: ${URL_SERVICIO_RESERVA:http://reserva-service:8080}


